<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your UniPath account</title>
</head>
<body style="margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:8px;border:1px solid #e5eaf2;overflow:hidden;">
                <tr>
                    <td style="padding:28px 32px 16px;">
                        <h1 style="margin:0;font-size:24px;line-height:1.3;color:#102033;">Verify your UniPath account</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 32px 8px;font-size:15px;line-height:1.6;color:#3b4658;">
                        <p style="margin:0 0 14px;">Hi {{fullName}},</p>
                        <p style="margin:0 0 18px;">Please confirm this email address to finish creating your UniPath account.</p>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:8px 32px 24px;">
                        <a href="{{verificationLink}}" style="display:inline-block;background:#175cd3;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:12px 22px;border-radius:6px;">Verify email</a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 32px 28px;font-size:13px;line-height:1.6;color:#667085;">
                        <p style="margin:0 0 10px;">If the button does not work, copy and paste this link into your browser:</p>
                        <p style="margin:0;word-break:break-all;"><a href="{{verificationLink}}" style="color:#175cd3;">{{verificationLink}}</a></p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
